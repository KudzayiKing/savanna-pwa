<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale`: blocking pinch-zoom fails WCAG 1.4.4 (Resize Text)
         and hurts low-vision users on mobile. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="application-name" content="Savanna" />
    <meta name="description" content="A thoughtful space for private conversations, local commerce, and learning." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <style>
      /**
       * Pre-React splash. Shows the animated mark while the bundle downloads;
       * main.tsx fades it out once the app has mounted (ErrorBoundary removes
       * it directly so a broken boot never hides behind it).
       *
       * Colors follow the app theme: the inline script below mirrors
       * ThemeContext's resolution (?theme= param, then localStorage.theme) and
       * adds `.dark` to <html> before first paint, so a dark-mode user never
       * sees a light flash. The bubble dots are cutouts of the page background,
       * so they swap with it too.
       */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fcfaf4;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.45s ease, visibility 0.45s, background-color 0.3s ease;
      }
      #splash.hide {
        opacity: 0;
        visibility: hidden;
      }
      #splash svg {
        width: min(62vmin, 320px);
        height: auto;
      }
      #splash .dot {
        fill: #fcfaf4;
      }
      .dark #splash {
        background: #111b21;
      }
      .dark #splash .dot {
        fill: #111b21;
      }
    </style>
    <script>
      (function () {
        try {
          var requested = new URLSearchParams(window.location.search).get("theme");
          var stored = window.localStorage.getItem("theme");
          var dark = requested === "dark" || (requested !== "light" && stored === "dark");
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.backgroundColor = "#111B21";
          }
        } catch (e) {
          /* localStorage unavailable (privacy mode): stay light */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Ramabhadra&display=swap" rel="stylesheet" />

           fill can follow the theme via the rules above. Keyframes are
           prefixed `sv-` and selectors scoped to #splash because an inline
           SVG <style> applies to the whole document. -->

        <style>
          #splash .bob, #splash .wing, #splash .tail, #splash .bubble { transform-box: view-box; }

          #splash .wing { animation: sv-flap 1.9s ease-in-out infinite; }
          #splash .tail { animation: sv-swish 2.6s ease-in-out infinite; }
          #splash .bubble { animation: sv-float 4.4s ease-in-out infinite; }
          #splash .w1 { transform-origin: 235px 118px; }
          #splash .w2 { transform-origin: 232px 292px; animation-delay: 0.07s; }
          #splash .w3 { transform-origin: 296px 448px; animation-delay: 0.14s; }
          #splash .w4 { transform-origin: 394px 580px; animation-delay: 0.21s; }
          #splash .w5 { transform-origin: 482px 608px; animation-delay: 0.1s; }
          #splash .t1 { transform-origin: 828px 614px; }
          #splash .t2 { transform-origin: 602px 882px; animation-delay: -1.3s; }
          #splash .bubble { transform-origin: 940px 458px; }
          #splash .dot { animation: sv-blink 1.5s ease-in-out infinite; }
          #splash .d2 { animation-delay: 0.25s; }
          #splash .d3 { animation-delay: 0.5s; }
          @keyframes sv-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
          @keyframes sv-flap { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(3.2deg); } }
          @keyframes sv-swish { 0%, 100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.6deg); } }
          @keyframes sv-float { 0%, 100% { transform: translate(0, 0) rotate(0.6deg); } 50% { transform: translate(-7px, -12px) rotate(-1deg); } }
          @keyframes sv-blink { 0%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
          @media (prefers-reduced-motion: reduce) {
            #splash .bob, #splash .wing, #splash .tail, #splash .bubble, #splash .dot { animation: none; }
          }
