<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale`: blocking pinch-zoom fails WCAG 1.4.4 (Resize Text)
         and hurts low-vision users on mobile. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="application-name" content="Savanna" />
    <meta name="description" content="A thoughtful space for private conversations, local commerce, and learning." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- TODO: iOS ignores SVG here and falls back to a page screenshot. Ship a
         180x180 PNG (icons/apple-touch-icon.png) and point this at it. -->
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Ramabhadra&display=swap" rel="stylesheet" />
    <title>Savanna — Connect, shop, learn</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
