[build]
  command = "pnpm build"
  publish = "dist/public"

# `api.mjs` is generated by `pnpm build` (see the build:netlify script), so the
# function ships as a single self-contained file with no node_modules to trace.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API traffic must be rewritten onto the function BEFORE the SPA fallback.
# Netlify applies redirects in order: if the /* catch-all came first it would
# swallow every /api/* call and hand the browser index.html, which tRPC then
# fails to parse as JSON ("Unexpected token '<', \"<!doctype\"...").
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback: the client uses client-side routing (wouter), so deep links
# must be served index.html. Netlify serves existing static files first,
# so /assets/* is unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
