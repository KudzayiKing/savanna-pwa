[build]
  command = "pnpm build"
  publish = "dist/public"

# SPA fallback: the client uses client-side routing (wouter), so deep links
# must be served index.html. Netlify serves existing static files first,
# so /assets/* is unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
